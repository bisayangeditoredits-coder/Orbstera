<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:;" />
  <title>Orbstera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: transparent;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e8eef8;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(ellipse 120% 80% at 50% 100%, rgba(59, 130, 246, 0.22), transparent 55%),
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99, 102, 241, 0.12), transparent 50%),
        #0a0a0a;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .orb {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, #3b82f6, #6366f1, #22d3ee, #3b82f6);
      filter: blur(0.2px);
      animation: pulse 1.8s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.45), 0 0 80px rgba(99, 102, 241, 0.2);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.92; }
    }
    h1 {
      margin-top: 1.25rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
    }
    p {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orb" aria-hidden="true"></div>
    <h1>Orbstera</h1>
    <p>Connecting to cloud…</p>
  </div>
</body>
</html>
