# Railway — always-on background workers (see docs/WORKER_DEPLOY.md)
# New Project → Deploy from GitHub → Railway reads this file automatically.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Workers do not serve HTTP; disable public networking in the Railway dashboard.
